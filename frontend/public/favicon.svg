<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="radarBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Circle Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#oceanGrad)" stroke="#38bdf8" stroke-width="2" />

  <!-- Radar Concentric Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="3,3" />
  <circle cx="32" cy="32" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
  <circle cx="32" cy="32" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Crosshairs -->
  <line x1="32" y1="6" x2="32" y2="58" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
  <line x1="6" y1="32" x2="58" y2="32" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Radar Sweep Sector -->
  <path d="M 32 32 L 32 10 A 22 22 0 0 1 54 32 Z" fill="url(#radarBeam)" />

  <!-- Oil Slick Detection Wave Motif -->
  <path d="M 18 42 C 24 38, 28 46, 34 42 C 40 38, 44 44, 48 41" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Satellite Sensor Beacon -->
  <circle cx="32" cy="32" r="4" fill="#00f2fe" />
  <circle cx="32" cy="32" r="8" fill="url(#beaconGlow)" />
  <circle cx="44" cy="20" r="3" fill="#f43f5e" stroke="#fff" stroke-width="1" />
</svg>
